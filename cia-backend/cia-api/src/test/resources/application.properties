# Test-scoped datasource hardening for Testcontainers integration tests.
#
# The PostgreSQL JDBC driver defaults to sslmode=prefer, which ATTEMPTS a TLS
# handshake against the SSL-less test container and then falls back to plaintext.
# Under a full-reactor `mvn verify`, ~40 @DataJpaTest classes each start their own
# Postgres container; the concurrent connection pressure intermittently fails that
# handshake with `SQLState 08P01 — An error occurred while setting up the SSL
# connection`, which trips ChartOfAccountServiceIT and cascades to sibling GL ITs.
#
# Disabling SSL removes the negotiation entirely (the containers never serve TLS),
# eliminating the flake at its source. Applied as a Hikari data-source-property so
# it reaches both the application connections and Flyway (which shares the Hikari
# DataSource — none of the ITs set spring.flyway.url). @DynamicPropertySource still
# owns the per-class URL / credentials / flyway.target; this only adds sslmode.
spring.datasource.hikari.data-source-properties.sslmode=disable
