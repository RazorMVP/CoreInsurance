spring:
  application:
    name: cia-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      # Outer hard cap. The per-endpoint FileUploadValidator policy caps (KYC/template
      # 5 MB, claims 10 MB) sit below this, so a policy violation surfaces as 422; this
      # 413s only abusive uploads. Fixes the silent 1 MB default that 500'd 5 MB KYC docs.
      max-file-size: 15MB
      max-request-size: 75MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/cia}
    username: ${DB_USERNAME:cia}
    password: ${DB_PASSWORD:cia_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Set the per-connection PostgreSQL session var that pgcrypto reads via
      # current_setting('app.pii_key'). Required for the @ColumnTransformer
      # encryption on Customer / CustomerDirector PII fields. Must run on every
      # new connection — Hikari runs this once after acquiring a connection
      # from the pool.
      connection-init-sql: "SET app.pii_key = '${cia.security.pii-key}'"

  jpa:
    hibernate:
      # Flyway is the source of truth for schema (see db/migration/V*.sql).
      # `validate` was the previous setting but it cannot honour
      # `@ColumnTransformer` + `columnDefinition = "bytea"` together — the
      # validator's expected-type derivation ignores columnDefinition and
      # reports a varchar/bytea mismatch on the four NDPR PII fields
      # (V24 migration). Drift between entities and migrations is caught
      # by integration tests (Testcontainers) instead. `none` is the
      # canonical Flyway-driven Spring Boot setting.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      # Kubernetes / Docker liveness + readiness probes. Exposes
      # /actuator/health/liveness and /actuator/health/readiness. The Docker
      # HEALTHCHECK (cia-backend/Dockerfile) and k8s probes hit these. The
      # readiness group also gates on the Temporal-worker readiness indicator
      # once present (observability slice); liveness stays a pure
      # process-alive signal.
      probes:
        enabled: true

cia:
  # CORS allow-list for the browser SPAs (back-office + platform console) calling
  # the internal /api/** surface cross-origin. CSV-bindable. Partner /partner/** is
  # M2M and intentionally not CORS-enabled. allowCredentials is on (Bearer auth), so
  # origins must be enumerated here or matched by allowed-origin-patterns (no "*").
  cors:
    allowed-origins: ${CIA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175}
    allowed-origin-patterns: ${CIA_CORS_ALLOWED_ORIGIN_PATTERNS:}

  temporal:
    host: ${TEMPORAL_HOST:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}

  storage:
    type: ${STORAGE_TYPE:minio}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket-name: ${STORAGE_BUCKET:cia-documents}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    region: ${STORAGE_REGION:us-east-1}

  naicom:
    mode: ${NAICOM_MODE:stub}
    api-url: ${NAICOM_API_URL:}

  niid:
    mode: ${NIID_MODE:stub}
    api-url: ${NIID_API_URL:}

  kyc:
    provider: ${KYC_PROVIDER:mock}
    provider-url: ${KYC_PROVIDER_URL:}

  notifications:
    email:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
    sms:
      enabled: ${SMS_NOTIFICATIONS_ENABLED:true}

  partner:
    oauth2:
      token-url: ${PARTNER_TOKEN_URL:http://localhost:8280/realms/cia/protocol/openid-connect/token}
    webhook:
      signing-secret: ${WEBHOOK_SIGNING_SECRET:dev-secret-replace-in-prod}
    rate-limit:
      enabled: ${PARTNER_API_RATE_LIMIT_ENABLED:true}
      # Fallback requests/minute when a client_id has no resolvable PartnerApp
      # (the real per-partner budget is PartnerApp.rateLimitRpm).
      default-rpm: ${PARTNER_API_RATE_LIMIT_DEFAULT_RPM:60}

  deployment:
    # Deployment-environment marker that gates ProductionSafetyValidator.
    # Defaults to "local" — local dev and the Testcontainers IT suite leave it
    # unset, so the validator is a no-op there. Set to "production" (or
    # "staging") in the deployment manifest: the validator then fails startup
    # if the `dev` Spring profile is active or if any secret (PII key, webhook
    # signing secret, storage creds, DB password) still holds its known-weak
    # development default. One required knob that enforces all the others.
    environment: ${CIA_DEPLOYMENT_ENVIRONMENT:local}

  security:
    # NDPR PII encryption key for pgcrypto (pgp_sym_encrypt / pgp_sym_decrypt).
    # Used via current_setting('app.pii_key') on the Hibernate connection.
    # MUST be set to a strong, externally managed value in production —
    # losing this key means all encrypted customer PII is unrecoverable.
    # Recommended: 32+ random bytes, base64-encoded.
    pii-key: ${PII_ENCRYPTION_KEY:dev-pii-key-do-not-use-in-prod-CHANGE-ME}

  keycloak:
    # Base Keycloak URL whose realms this resource server trusts (realm-per-tenant).
    # An incoming JWT's `iss` must be {server-url}/realms/{realm}. Mirrors the
    # frontend VITE_KEYCLOAK_URL and the partner token-url host.
    server-url: ${KEYCLOAK_URL:http://localhost:8280}
    # Admin-client config for UserService (Module 1 Users page). The admin
    # client authenticates with service-account credentials against the
    # `master` realm, then performs user CRUD against the tenant realm
    # configured below. Disable in dev when no Keycloak instance is running —
    # UserController returns 503 SERVICE_UNAVAILABLE with a clear message.
    admin:
      enabled:       ${KEYCLOAK_ADMIN_ENABLED:false}
      server-url:    ${KEYCLOAK_URL:http://localhost:8280}
      admin-realm:   ${KEYCLOAK_ADMIN_REALM:master}
      client-id:     ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      # Realm operated on for user CRUD. Mirrors spring.security.oauth2's
      # KEYCLOAK_REALM. When realm-per-tenant lands (PRD multi-tenant model),
      # this becomes a TenantContext-derived lookup; today it's a single
      # shared realm matching the application's resource-server config.
      target-realm:  ${KEYCLOAK_REALM:cia}
      # Back-office SPA public client the provisioner upserts into the target
      # realm on boot (PKCE S256 + tenant_id claim mapper). Must match the
      # frontend's VITE_KEYCLOAK_CLIENT_ID. Redirect URIs are per-tenant in
      # prod (e.g. https://acme.cia.app/*); default is the local Vite origin.
      back-office-client-id:     ${KEYCLOAK_BACK_OFFICE_CLIENT_ID:cia-back-office}
      back-office-redirect-uris: ${KEYCLOAK_BACK_OFFICE_REDIRECT_URIS:http://localhost:5173/*}
      # NubSure branded Keycloak login theme. Blank = leave the realm's login
      # theme untouched (safe default — ITs + un-themed Keycloaks unaffected).
      # Set to "nubsure" (mounted via docker-compose) to apply branding.
      back-office-login-theme:   ${KEYCLOAK_BACK_OFFICE_LOGIN_THEME:}

  tenants:
    bootstrap:
      # Master switch — OFF by default so dev + the IT suite never provision tenants.
      # Set CIA_TENANT_BOOTSTRAP_ENABLED=true in a real deployment.
      enabled: ${CIA_TENANT_BOOTSTRAP_ENABLED:false}
      tenants: []
      # Example (supply via the deployment manifest / secret store):
      # tenants:
      #   - schema: tenant_acme
      #     realm: tenant_acme
      #     display-name: "Acme Insurance"
      #     subdomain: acme
      #     admin-username: admin
      #     admin-email: admin@acme.example
      #     admin-temp-password: ${ACME_ADMIN_TEMP_PASSWORD}

  platform:
    realm: ${CIA_PLATFORM_REALM:platform}
    client-id: ${CIA_PLATFORM_CLIENT_ID:cia-platform}
    redirect-uris: ${CIA_PLATFORM_REDIRECT_URIS:http://localhost:5175/*}
    bootstrap:
      enabled: ${CIA_PLATFORM_BOOTSTRAP_ENABLED:false}
      admin-username: ${CIA_PLATFORM_BOOTSTRAP_ADMIN_USERNAME:superadmin}
      admin-email: ${CIA_PLATFORM_BOOTSTRAP_ADMIN_EMAIL:superadmin@cia.local}
      admin-temp-password: ${CIA_PLATFORM_BOOTSTRAP_ADMIN_TEMP_PASSWORD:}
    # Bound by cia-auth PlatformRealmProperties (added in a subsequent SP1 task on this branch);
    # gates inactive-tenant JWTs at the auth layer. Unbound until that class lands.
    tenant-allowlist:
      enabled: ${CIA_PLATFORM_TENANT_ALLOWLIST_ENABLED:false}

springdoc:
  api-docs:
    path: /partner/v3/api-docs
  swagger-ui:
    path: /partner/docs
  default-produces-media-type: application/json

# Partner API rate limiting is handled by PartnerRateLimitFilter (per-client,
# keyed by client_id, sized to PartnerApp.rateLimitRpm) — see RateLimitConfig.
# The old declarative bucket4j starter filter used a single shared bucket for
# ALL partners (no cache-key), so one partner could exhaust everyone's budget;
# it is disabled here.
bucket4j:
  enabled: false

logging:
  level:
    com.nubeero.cia: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
