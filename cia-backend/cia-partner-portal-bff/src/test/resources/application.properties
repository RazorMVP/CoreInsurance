# Test-only default for cia.security.pii-key. PiiKeyValidator (cia-common, registered
# globally via META-INF/spring.factories as an EnvironmentPostProcessor) fails startup of
# ANY Spring Boot context — including this module's isolated @DataJpaTest fixture
# (PartnerPortalBffTestApplication) — unless the property is set. cia-api supplies this via
# its own application.yml dev default; this module has no equivalent main resource, so it
# needs its own test-scoped default. Never used for real PII — no encrypted columns are
# exercised by this module's tests.
cia.security.pii-key=dev-pii-key-do-not-use-in-prod-test-only
