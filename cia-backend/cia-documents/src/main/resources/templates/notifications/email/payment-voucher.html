<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; color: #333; max-width: 600px;">
  <h2>Payment voucher</h2>
  <p>Dear {{beneficiaryName}},</p>
  <p>Please find attached a payment voucher for the sum of
     <b>{{amount}}</b> processed on
     {{paymentDate}}.</p>
  <p>Voucher number: {{paymentNumber}}.<br/>
     Credit note: {{creditNoteNumber}}.</p>
  <hr/>
  <p style="color: #888; font-size: 0.9em;">
    Regards,<br/>
    {{companyName}}
  </p>
</body>
</html>
