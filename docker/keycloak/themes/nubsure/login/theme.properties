# NubSure branded login theme (Keycloak 24).
#
# Extends the stock `keycloak` login theme and layers brand CSS on top.
# `styles` lists css/login.css (resolves to the PARENT's login.css since this
# theme defines no login.css of its own) FOLLOWED BY css/nubsure.css (ours) —
# so we inherit all base styling and only override colours/logo. This ordering
# is version-robust: a Keycloak upgrade that changes the base login.css is
# picked up automatically; we never copy/fork it.
parent=keycloak
import=common/keycloak
styles=css/login.css css/nubsure.css
