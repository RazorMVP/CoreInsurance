# Non-secret defaults + placeholders. NEVER put secret values here (see secret.example.yaml).
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/razormvp/coreinsurance/cia-backend
  tag: ""                       # REQUIRED at deploy — pin to a commit SHA. Empty fails rendering on purpose.
  pullPolicy: IfNotPresent

replicaCount: 3

# Name of the pre-existing, operator-managed Secret carrying all secret env (see secret.example.yaml).
existingSecret: cia-backend-secrets

serviceAccount:
  create: true
  name: ""
  annotations: {}               # e.g. eks.amazonaws.com/role-arn for IRSA at go-live

# Non-secret env -> ConfigMap (envFrom). Secret env comes from existingSecret.
env:
  SPRING_PROFILES_ACTIVE: prod
  CIA_DEPLOYMENT_ENVIRONMENT: production
  SERVER_PORT: "8090"
  CIA_TENANT_BOOTSTRAP_ENABLED: "false"
  CIA_KEYCLOAK_ADMIN_ENABLED: "false"
  DB_POOL_MAX: "10"
  DB_POOL_MIN: "10"
  KEYCLOAK_URL: ""
  TEMPORAL_HOST: ""
  STORAGE_TYPE: s3
  STORAGE_ENDPOINT: ""
  STORAGE_BUCKET: cia-documents
  PARTNER_API_RATE_LIMIT_STORE: in-memory
  JAVA_OPTS: "-XX:MaxRAMPercentage=70"
  # Optional read replica for the report-heavy cia-reports analytical queries
  # (see docs-site/docs/operations/disaster-recovery.md + CLAUDE.md §7). UNSET =
  # single pool, the default. To enable, uncomment + set the replica JDBC URL;
  # only cia-reports report runs route there, everything else stays on primary.
  # Credentials default to the primary's (DB_USERNAME/DB_PASSWORD) unless you
  # also add CIA_DATASOURCE_REPLICA_USERNAME/_PASSWORD to the Secret.
  # NOTE: omit the key entirely to disable — do NOT set it blank (a blank value
  # still activates routing and the replica pool would fail to connect).
  # CIA_DATASOURCE_REPLICA_URL: "jdbc:postgresql://<replica-host>:5432/cia"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 1.5Gi

# Pod-level securityContext. runAsUser/runAsGroup are NUMERIC (not relying on the
# image's named `cia` user) so kubelet can verify runAsNonRoot on any container
# runtime — some containerd versions reject a named USER under runAsNonRoot with
# CreateContainerConfigError. 999 matches the image's `useradd --system cia`.
# fsGroup makes the /tmp emptyDir group-writable under readOnlyRootFilesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

service:
  port: 8090

ingress:
  enabled: true
  className: nginx
  host: "*.cia.app"              # wildcard host; tlsSecretName MUST hold a wildcard cert for *.cia.app
  tlsSecretName: cia-backend-tls # pre-existing TLS Secret (wildcard cert). Blank = omit the tls: block (HTTP-only / cert-manager-annotation clusters)
  annotations: {}

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 2

# OPTIONAL logical-backup CronJob — SECONDARY to managed-Postgres PITR (the DR
# PRIMARY). Disabled by default; see docs-site/docs/operations/disaster-recovery.md.
# When enabled, backup.image / backup.db.host / backup.s3.bucket are REQUIRED
# (the template fails to render otherwise — fail-fast, no silent misconfig).
backup:
  enabled: false
  # MUST bundle pg_dump (matching the PG server major) AND the object-storage
  # client your uploadCommand uses (aws-cli / mc / gsutil). Stock postgres:16
  # has pg_dump but NO s3 client — supply a combined image and pin by digest.
  image: ""
  schedule: "0 1 * * *"            # daily 01:00 UTC
  db:
    host: ""                       # PGHOST — the Postgres service/endpoint
    port: 5432
    name: cia
  s3:
    bucket: ""                     # use a SEPARATE bucket from STORAGE_BUCKET so
    prefix: db-backups             # document objects and DB backups have
    region: us-east-1              # independent lifecycle/retention policies
    endpoint: ""                   # blank = AWS S3; set for MinIO/other S3-compatible
  # Upload step. $dump (gzip file), $ts (UTC stamp) and $endpoint_arg are in
  # scope; creds come from the env above. Override for mc/gsutil. RETENTION is an
  # object-storage lifecycle policy on bucket/prefix — deliberately NOT here.
  uploadCommand: 'aws s3 cp "$dump" "s3://${S3_BUCKET}/${S3_PREFIX}/cia-${ts}.sql.gz" $endpoint_arg'
  backoffLimit: 2
  activeDeadlineSeconds: 3600      # 1h cap so a hung dump can't block the next run
  tmpSizeLimit: 8Gi                # writable emptyDir for the gzip dump (readOnlyRootFs)
  historyLimit:
    success: 3
    failed: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
