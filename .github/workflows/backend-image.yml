name: Backend Image

# Builds the cia-backend container image (cia-backend/Dockerfile), pushes to
# GHCR on main / tags, and gates on a Trivy CRITICAL/HIGH CVE scan. On PRs the
# image is built + scanned but not pushed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    name: Build backend container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cia-backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: cia-backend
          file: cia-backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image reference for scanning
        id: scan-image
        shell: bash
        run: |
          first_tag="$(printf '%s\n' "$TAGS" | head -n 1)"
          if [[ -z "$first_tag" ]]; then
            echo "No backend image tag was generated for scanning." >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "ref=$first_tag" >> "$GITHUB_OUTPUT"
          else
            image_repo="${first_tag%:*}"
            echo "ref=${image_repo}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Generate vulnerability scan report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.scan-image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload vulnerability scan report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # CVE gate is ENFORCING (exit-code: 1) — fails the build on any
      # CRITICAL/HIGH finding (OS or library). The remediation slice
      # `remediate-backend-image-cves` landed: Spring Boot 3.3.5 -> 3.5.14
      # (45 -> 16 CVEs) plus the long-tail bumps (Temporal 1.35, Tomcat
      # 10.1.55, netty 4.1.134, pgjdbc 42.7.11, bcprov-jdk18on 1.84) drove the
      # image to 0 CRITICAL/HIGH. The SARIF still uploads to the Security tab
      # for the full (incl. LOW/MEDIUM) picture; this step is the hard gate
      # that blocks regressions going forward.
      - name: Report high and critical CVEs
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.scan-image.outputs.ref }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
