name: Backend Image

# Builds the cia-backend container image (cia-backend/Dockerfile), pushes to
# GHCR on main / tags, and gates on a Trivy CRITICAL/HIGH CVE scan. On PRs the
# image is built + scanned but not pushed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    name: Build backend container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cia-backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: cia-backend
          file: cia-backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image reference for scanning
        id: scan-image
        shell: bash
        run: |
          first_tag="$(printf '%s\n' "$TAGS" | head -n 1)"
          if [[ -z "$first_tag" ]]; then
            echo "No backend image tag was generated for scanning." >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "ref=$first_tag" >> "$GITHUB_OUTPUT"
          else
            image_repo="${first_tag%:*}"
            echo "ref=${image_repo}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Generate vulnerability scan report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.scan-image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload vulnerability scan report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # CVE gate is REPORT-ONLY for now (exit-code: 0) — it prints the
      # CRITICAL/HIGH table to the job log and the SARIF is uploaded to the
      # Security tab above, but it does NOT fail the build. Rationale: the
      # current findings are application-dependency CVEs rooted in the Spring
      # Boot 3.3.5 BOM (Tomcat/Netty/spring-security/pgjdbc/etc.), whose
      # remediation is a deliberate dependency-bump slice with cross-IT
      # regression risk — tracked as backlog `remediate-backend-image-cves`
      # (P1). Flip exit-code back to '1' once that slice lands so the gate
      # blocks regressions thereafter.
      - name: Report high and critical CVEs (non-blocking)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.scan-image.outputs.ref }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '0'
