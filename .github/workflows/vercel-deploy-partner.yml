name: Vercel Deploy — Partner Portal

on:
  push:
    branches: [main]
    paths:
      - 'cia-frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'cia-frontend/**'

jobs:
  deploy:
    name: Deploy Partner Portal to Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        working-directory: cia-frontend/apps/partner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PARTNER_PROJECT_ID }}

      - name: Pull Vercel environment (preview)
        if: github.ref != 'refs/heads/main'
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
        working-directory: cia-frontend/apps/partner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PARTNER_PROJECT_ID }}

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=$VERCEL_TOKEN
        working-directory: cia-frontend/apps/partner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PARTNER_PROJECT_ID }}
          # Demo-only build until a real `partner` Keycloak + backend exist. Baked at build time
          # here (NOT a Vercel dashboard env var — that path is error-prone: an empty value silently
          # ships a blank page via the main.tsx guard). REMOVE this line when wiring real auth and
          # set VITE_API_BASE_URL in Vercel instead.
          VITE_DEMO_MODE: 'true'

      - name: Build (preview)
        if: github.ref != 'refs/heads/main'
        run: vercel build --token=$VERCEL_TOKEN
        working-directory: cia-frontend/apps/partner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PARTNER_PROJECT_ID }}
          # Demo-only preview build (see Build (production) note). Remove when real auth is wired.
          VITE_DEMO_MODE: 'true'

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        working-directory: cia-frontend/apps/partner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PARTNER_PROJECT_ID }}

      - name: Deploy preview
        if: github.ref != 'refs/heads/main'
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN
        working-directory: cia-frontend/apps/partner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PARTNER_PROJECT_ID }}
