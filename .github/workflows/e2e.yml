name: E2E

# Full-stack Playwright golden paths: the real back-office SPA (DevAuthProvider)
# driven against a live cia-api started with the `dev,e2e` profiles + a real
# Postgres. Proves the frontend → API → DB chain per module.

on:
  push:
    branches: [main]
    paths: ['cia-backend/**', 'cia-frontend/**', '.github/workflows/e2e.yml']
  pull_request:
    branches: [main]
    paths: ['cia-backend/**', 'cia-frontend/**', '.github/workflows/e2e.yml']

jobs:
  e2e:
    name: Full-stack E2E (Playwright · live cia-api)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cia
          POSTGRES_PASSWORD: cia_dev
          POSTGRES_DB: cia
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U cia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # The app wires a spring-data-redis connection factory (cia.data.redis →
      # :6380); its health indicator must be UP for /actuator/health to return
      # 200. Mirrors the local docker-compose Redis (6380).
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: cia-backend/pom.xml

      - name: Build backend
        working-directory: cia-backend
        run: ./mvnw -pl cia-api -am install -DskipTests --batch-mode --no-transfer-progress

      - name: Start backend (dev,e2e) in background
        working-directory: cia-backend
        env:
          SPRING_PROFILES_ACTIVE: dev,e2e
          DB_URL: jdbc:postgresql://localhost:5434/cia
          # No Temporal in this job — the app boots Temporal-degraded by design.
          TEMPORAL_HOST: temporal-not-deployed:7233
        run: |
          nohup ./mvnw -pl cia-api spring-boot:run -Dspring-boot.run.profiles=dev,e2e \
            --batch-mode --no-transfer-progress > backend-e2e.log 2>&1 &
          echo "backend launching (pid $!)"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8090/actuator/health > /dev/null; then
              echo "backend healthy after ~$((i*3))s"; exit 0
            fi
            sleep 3
          done
          echo "::error::backend did not become healthy in 180s"
          tail -80 cia-backend/backend-e2e.log || true
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: cia-frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: cia-frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (build SPA + Playwright golden paths)
        working-directory: cia-frontend
        env:
          CI: 'true'
          E2E_API_BASE_URL: http://localhost:8090
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: cia-frontend/playwright-report/
          retention-days: 7

      - name: Backend log on failure
        if: failure()
        run: tail -120 cia-backend/backend-e2e.log || true
